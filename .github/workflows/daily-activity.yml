name: Daily Learning Activity

on:
  schedule:
    - cron: "30 14 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update learning log
        run: |
          echo "Last updated: $(date -u)" > activity.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add activity.txt

          git commit -m "chore: update daily activity" || echo "No changes to commit"

          git push
